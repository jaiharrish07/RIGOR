services:
  postgres:
    image: postgres:17-alpine
    container_name: rigor-postgres
    restart: unless-stopped
    environment:
      # Sourced from .env so the container's credentials and the app's
      # DATABASE_URL cannot drift apart. The defaults match .env.example, so
      # `docker compose up` still works before anyone has written a .env.
      POSTGRES_USER: ${POSTGRES_USER:-rigor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rigor}
      POSTGRES_DB: ${POSTGRES_DB:-rigor}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the rigor_test database pytest needs. Only runs when the data
      # volume is empty, i.e. on first `docker compose up`.
      - ./scripts/init_test_db.sql:/docker-entrypoint-initdb.d/10-init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rigor} -d ${POSTGRES_DB:-rigor}"]
      interval: 5s
      timeout: 5s
      retries: 5

  grobid:
    image: lfoppiano/grobid:0.8.1
    container_name: rigor-grobid
    restart: unless-stopped
    ports:
      - "8070:8070"
    environment:
      JAVA_OPTS: "-Xmx4g"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8070/api/isalive"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:
